<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- EmTech Media — OG card (1200x630). Edit this SVG, then re-render to og-image.png -->
  <rect width="1200" height="630" fill="#F1EEE6"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#131210" stroke-width="2"/>

  <!-- Brand row — "The Cursor" mark (brand/cursor-mark.svg) -->
  <g transform="translate(96 104) scale(0.27083)">
    <rect x="4" y="4" width="88" height="88" fill="#C8F03C" stroke="#131210" stroke-width="4"/>
    <polyline points="26,27 52,48 26,69" fill="none" stroke="#131210" stroke-width="10" stroke-linecap="square"/>
    <rect x="62" y="61" width="22" height="10" fill="#131210"/>
  </g>
  <text x="140" y="125" font-family="'IBM Plex Mono','Courier New',monospace" font-size="23" letter-spacing="7" fill="#131210">EMTECH MEDIA</text>

  <!-- Headline -->
  <text x="94" y="368" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="96" font-weight="900" letter-spacing="-2" fill="#131210">PC &amp; Mac problems,</text>
  <text x="94" y="478" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="118" fill="#131210">solved.</text>

  <!-- Accent bar -->
  <rect x="98" y="512" width="230" height="16" fill="#C8F03C" stroke="#131210" stroke-width="2"/>

  <!-- Meta line -->
  <text x="96" y="562" font-family="'IBM Plex Mono','Courier New',monospace" font-size="20" letter-spacing="4" fill="#5F5B50">WINDOWS · MACOS · PLAIN ENGLISH</text>
</svg>
