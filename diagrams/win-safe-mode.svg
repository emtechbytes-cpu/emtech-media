<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: three entry paths — working desktop, sign-in screen with Shift plus Restart, and triple power-cut — converging into the Windows Recovery menu where key 4 for Safe Mode is highlighted">
  <title>Windows — start in Safe Mode</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 18 — WINDOWS · BOOT</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Three doors, one room</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

  <!-- entry path 1 -->
  <rect x="70" y="130" width="240" height="62" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="86" y="155" font-size="11" font-weight="600" fill="#131210">WORKING DESKTOP</text>
  <text class="mono" x="86" y="175" font-size="9.5" fill="#5f5b50">Settings → Recovery → Restart now</text>

  <!-- entry path 2 -->
  <rect x="70" y="214" width="240" height="62" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="86" y="239" font-size="11" font-weight="600" fill="#131210">SIGN-IN SCREEN</text>
  <text class="mono" x="86" y="259" font-size="9.5" fill="#5f5b50">hold Shift while you click Restart</text>

  <!-- entry path 3 -->
  <rect x="70" y="298" width="240" height="62" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="86" y="323" font-size="11" font-weight="600" fill="#131210">WON'T BOOT AT ALL</text>
  <text class="mono" x="86" y="343" font-size="9.5" fill="#5f5b50">power-cut at boot ×3 — the 4th try wins</text>

  <!-- converging arrows -->
  <line x1="312" y1="161" x2="382" y2="252" stroke="#131210" stroke-width="2"/>
  <polygon points="390,254 376,246 378,258" fill="#131210"/>
  <line x1="312" y1="245" x2="382" y2="268" stroke="#131210" stroke-width="2"/>
  <polygon points="390,270 376,262 378,274" fill="#131210"/>
  <line x1="312" y1="329" x2="382" y2="284" stroke="#131210" stroke-width="2"/>
  <polygon points="390,286 376,278 378,290" fill="#131210"/>

  <!-- recovery panel -->
  <rect x="390" y="120" width="340" height="300" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="390" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="408" y="132" width="10" height="10" fill="#131210"/>
  <text class="mono" x="426" y="141" font-size="11" fill="#5f5b50">RECOVERY — STARTUP SETTINGS</text>

  <text class="mono" x="410" y="196" font-size="11" fill="#131210">Troubleshoot → Advanced options</text>
  <text class="mono" x="410" y="222" font-size="11" fill="#131210">Startup Settings → Restart</text>
  <line x1="410" y1="248" x2="710" y2="248" stroke="rgba(19,18,16,.18)" stroke-width="1"/>

  <!-- keycap 4 — highlighted -->
  <rect x="430" y="272" width="56" height="56" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="458" y="312" font-size="26" font-weight="600" fill="#131210" text-anchor="middle">4</text>
  <text class="mono" x="458" y="352" font-size="9.5" letter-spacing="1" fill="#131210" text-anchor="middle">SAFE MODE</text>

  <!-- keycap 5 -->
  <rect x="520" y="272" width="56" height="56" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="548" y="312" font-size="26" font-weight="600" fill="#131210" text-anchor="middle">5</text>
  <text class="mono" x="548" y="352" font-size="9.5" letter-spacing="1" fill="#5f5b50" text-anchor="middle">+ NETWORKING</text>

  <!-- note -->
  <text class="serif" x="70" y="446" font-size="17" fill="#5f5b50">Gone in Safe Mode? It's software — and that one fact saves hours.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">ADVANCED STARTUP → TROUBLESHOOT → STARTUP SETTINGS</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
