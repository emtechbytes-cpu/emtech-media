<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: open PC case side view with fans, heatsink fins and dust being blown out, plus a numbered clean-out checklist">
  <title>Windows — the dust clean-out</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 06 — WINDOWS · MAINTENANCE</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Blow the dust out, hold the blades</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">45 MIN · MEDIUM</text>

  <!-- case -->
  <rect x="80" y="130" width="380" height="310" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>

  <!-- PSU + fan -->
  <rect x="100" y="360" width="110" height="54" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <circle cx="135" cy="387" r="16" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="135" y1="373" x2="135" y2="401" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="121" y1="387" x2="149" y2="387" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>

  <!-- heatsink fins -->
  <rect x="260" y="250" width="90" height="110" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="274" y1="258" x2="274" y2="352" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="288" y1="258" x2="288" y2="352" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="302" y1="258" x2="302" y2="352" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="316" y1="258" x2="316" y2="352" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="330" y1="258" x2="330" y2="352" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>

  <!-- rear fan (highlight: hold the blades) -->
  <circle cx="395" cy="190" r="32" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <line x1="395" y1="164" x2="395" y2="216" stroke="#131210" stroke-width="1.5"/>
  <line x1="369" y1="190" x2="421" y2="190" stroke="#131210" stroke-width="1.5"/>
  <line x1="377" y1="172" x2="413" y2="208" stroke="#131210" stroke-width="1.5"/>
  <line x1="413" y1="172" x2="377" y2="208" stroke="#131210" stroke-width="1.5"/>
  <circle cx="395" cy="190" r="5" fill="#131210"/>

  <!-- airflow arrows -->
  <line x1="120" y1="190" x2="240" y2="190" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>
  <line x1="240" y1="190" x2="230" y2="184" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>
  <line x1="240" y1="190" x2="230" y2="196" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>

  <!-- dust puffs -->
  <circle cx="478" cy="178" r="3" fill="rgba(19,18,16,.35)"/>
  <circle cx="492" cy="196" r="4" fill="rgba(19,18,16,.35)"/>
  <circle cx="476" cy="212" r="2.5" fill="rgba(19,18,16,.35)"/>
  <circle cx="498" cy="170" r="2" fill="rgba(19,18,16,.35)"/>

  <!-- checklist -->
  <text class="mono" x="520" y="180" font-size="10" fill="#5f5b50">01</text>
  <text class="mono" x="548" y="180" font-size="10.5" fill="#131210">POWER OFF, UNPLUG</text>
  <text class="mono" x="520" y="230" font-size="10" fill="#5f5b50">02</text>
  <text class="mono" x="548" y="230" font-size="10.5" fill="#131210">SHORT BURSTS — PSU FIRST</text>
  <text class="mono" x="520" y="280" font-size="10" fill="#5f5b50">03</text>
  <text class="mono" x="548" y="280" font-size="10.5" font-weight="600" fill="#131210">HOLD BLADES WHILE BLOWING</text>
  <text class="mono" x="520" y="330" font-size="10" fill="#5f5b50">04</text>
  <text class="mono" x="548" y="330" font-size="10.5" fill="#131210">RESEAT RAM ON THE WAY BACK IN</text>

  <!-- note -->
  <text class="serif" x="80" y="470" font-size="16" fill="#5f5b50">Loud fans usually mean dust, not a failing fan.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">CASE OPEN · COMPRESSED AIR</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">ANY PC</text>
</svg>
