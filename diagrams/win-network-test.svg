<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: network path from PC to router to ISP, with the router highlighted as the likely culprit when wired and wireless speeds differ">
  <title>Windows — find where the slowdown is</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 07 — WINDOWS · NETWORK</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Prove where the slowdown is</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">10 MIN · EASY</text>

  <!-- PC node -->
  <rect x="130" y="210" width="90" height="64" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="175" y1="274" x2="175" y2="288" stroke="#131210" stroke-width="2"/>
  <line x1="155" y1="288" x2="195" y2="288" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="175" y="312" font-size="10.5" fill="#5f5b50" text-anchor="middle">YOUR PC</text>

  <!-- router node (highlight) -->
  <line x1="380" y1="225" x2="370" y2="196" stroke="#131210" stroke-width="2"/>
  <line x1="394" y1="225" x2="390" y2="196" stroke="#131210" stroke-width="2"/>
  <rect x="360" y="225" width="110" height="54" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="415" y="312" font-size="10.5" font-weight="600" fill="#131210" text-anchor="middle">ROUTER</text>

  <!-- ISP node -->
  <circle cx="650" cy="257" r="34" fill="none" stroke="#131210" stroke-width="2"/>
  <ellipse cx="650" cy="257" rx="14" ry="34" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <line x1="616" y1="257" x2="684" y2="257" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <text class="mono" x="650" y="312" font-size="10.5" fill="#5f5b50" text-anchor="middle">THE LINE / ISP</text>

  <!-- connectors -->
  <line x1="220" y1="257" x2="360" y2="257" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="290" y="245" font-size="9.5" fill="#5f5b50" text-anchor="middle">WIRED + WIFI</text>
  <line x1="470" y1="257" x2="616" y2="257" stroke="#131210" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="mono" x="543" y="245" font-size="9.5" fill="#5f5b50" text-anchor="middle">YOUR ISP'S LINE</text>

  <!-- callout -->
  <line x1="415" y1="225" x2="415" y2="176" stroke="#131210" stroke-width="1.5"/>
  <text class="mono" x="415" y="164" font-size="10.5" font-weight="600" fill="#131210" text-anchor="middle">BIG GAP? IT'S THE ROUTER</text>

  <!-- readouts -->
  <rect x="95" y="345" width="140" height="28" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>
  <text class="mono" x="165" y="364" font-size="10.5" fill="#5f5b50" text-anchor="middle">WIFI · 42 MB/S</text>
  <rect x="95" y="381" width="140" height="28" fill="#131210"/>
  <text class="mono" x="165" y="400" font-size="10.5" font-weight="600" fill="#f1eee6" text-anchor="middle">WIRED · 198 MB/S</text>

  <!-- note -->
  <text class="serif" x="270" y="436" font-size="17" fill="#5f5b50">Same speed on both? That's your ISP — with numbers to quote.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SPEEDTEST.NET · WIRED VS WIRELESS</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">ANY PC</text>
</svg>
