<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: a Mac backing up to an external drive, with a timeline of hourly snapshots ending at the current one">
  <title>Mac — set up Time Machine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 13 — MAC · BACKUPS</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Undo for your whole computer</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">20 MIN · EASY</text>

  <!-- laptop -->
  <rect x="120" y="195" width="110" height="74" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <polygon points="105,269 245,269 255,285 95,285" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="175" y="315" font-size="10.5" fill="#5f5b50" text-anchor="middle">YOUR MAC</text>

  <!-- arrow 1 -->
  <line x1="268" y1="240" x2="342" y2="240" stroke="#131210" stroke-width="2"/>
  <line x1="342" y1="240" x2="332" y2="234" stroke="#131210" stroke-width="2"/>
  <line x1="342" y1="240" x2="332" y2="246" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="305" y="226" font-size="9.5" fill="#5f5b50" text-anchor="middle">FIRST BACKUP — HOURS</text>

  <!-- external drive -->
  <rect x="355" y="205" width="130" height="70" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <rect x="460" y="228" width="10" height="10" fill="#131210"/>
  <text class="mono" x="420" y="315" font-size="10.5" fill="#5f5b50" text-anchor="middle">BACKUP DRIVE</text>

  <!-- arrow 2 -->
  <line x1="498" y1="240" x2="560" y2="240" stroke="#131210" stroke-width="2"/>
  <line x1="560" y1="240" x2="550" y2="234" stroke="#131210" stroke-width="2"/>
  <line x1="560" y1="240" x2="550" y2="246" stroke="#131210" stroke-width="2"/>

  <!-- snapshot timeline -->
  <line x1="577" y1="240" x2="693" y2="240" stroke="rgba(19,18,16,.4)" stroke-width="2"/>
  <circle cx="585" cy="240" r="8" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <circle cx="635" cy="240" r="8" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <circle cx="685" cy="240" r="8" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="585" y="272" font-size="9.5" fill="#5f5b50" text-anchor="middle">MON</text>
  <text class="mono" x="635" y="272" font-size="9.5" fill="#5f5b50" text-anchor="middle">TUE</text>
  <text class="mono" x="685" y="272" font-size="9.5" font-weight="600" fill="#131210" text-anchor="middle">NOW</text>

  <!-- notes -->
  <text class="serif" x="110" y="380" font-size="17" fill="#5f5b50">Hourly after that — start the first one before bed.</text>
  <rect x="110" y="402" width="26" height="26" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <text class="mono" x="123" y="420" font-size="9" fill="#131210" text-anchor="middle">Cmd</text>
  <rect x="140" y="402" width="26" height="26" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <text class="mono" x="153" y="420" font-size="9" fill="#131210" text-anchor="middle">Opt</text>
  <text class="mono" x="180" y="420" font-size="10.5" fill="#5f5b50">click any file → browse its past versions</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SYSTEM SETTINGS → GENERAL → TIME MACHINE</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">MACOS</text>
</svg>
