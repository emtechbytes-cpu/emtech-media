<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 32 — WINDOWS · GAMING</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">Five mundane causes</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">15 MIN · EASY</text>

<rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><rect x="84" y="163" width="632" height="42" fill="#c8f03c"/><text class="mono" x="102" y="188" font-size="12" font-weight="600" fill="#131210">1</text><text class="mono" x="132" y="188" font-size="12.5" font-weight="600" fill="#131210">GPU driver — clean install if it persists</text><text class="mono" x="102" y="244" font-size="12" font-weight="600" fill="#5f5b50">2</text><text class="mono" x="132" y="244" font-size="12.5" fill="#131210">Verify game files in the launcher</text><text class="mono" x="102" y="300" font-size="12" font-weight="600" fill="#5f5b50">3</text><text class="mono" x="132" y="300" font-size="12.5" fill="#131210">DirectX + VCRedist packs installed</text><text class="mono" x="102" y="356" font-size="12" font-weight="600" fill="#5f5b50">4</text><text class="mono" x="132" y="356" font-size="12.5" fill="#131210">One overlay max — drop the rest</text><text class="mono" x="102" y="412" font-size="12" font-weight="600" fill="#5f5b50">5</text><text class="mono" x="132" y="412" font-size="12.5" fill="#131210">Game Bar + Game DVR off</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
<text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">DRIVER · FILES · RUNTIME · OVERLAYS · GAME BAR</text>
