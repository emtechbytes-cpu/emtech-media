<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: a disk usage bar showing the last ten percent free space zone highlighted as the headroom macOS needs">
  <title>Mac — keep ten percent of the disk free</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 11 — MAC · STORAGE</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Leave the drive some air</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">10 MIN · EASY</text>

  <!-- mac window -->
  <rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="90" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <rect x="104" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <rect x="118" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <text class="mono" x="400" y="142" font-size="11" fill="#5f5b50" text-anchor="middle">Storage</text>

  <!-- heading -->
  <text class="serif" x="110" y="202" font-size="20" fill="#131210">Free space rule of thumb</text>
  <text class="mono" x="690" y="200" font-size="10.5" fill="#5f5b50" text-anchor="end">SWAP · CACHES · TIME MACHINE</text>

  <!-- disk bar -->
  <rect x="110" y="240" width="230" height="54" fill="#131210"/>
  <rect x="340" y="240" width="170" height="54" fill="rgba(19,18,16,.55)"/>
  <rect x="510" y="240" width="140" height="54" fill="rgba(19,18,16,.28)"/>
  <rect x="650" y="240" width="40" height="54" fill="#c8f03c" stroke="#131210" stroke-width="2"/>

  <!-- 10% marker -->
  <line x1="650" y1="226" x2="650" y2="308" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="646" y="220" font-size="9.5" font-weight="600" fill="#131210" text-anchor="end">10% MARK</text>

  <!-- labels -->
  <text class="mono" x="225" y="318" font-size="10.5" fill="#5f5b50" text-anchor="middle">APPS</text>
  <text class="mono" x="425" y="318" font-size="10.5" fill="#5f5b50" text-anchor="middle">DOCS</text>
  <text class="mono" x="580" y="318" font-size="10.5" fill="#5f5b50" text-anchor="middle">SYSTEM</text>
  <text class="mono" x="670" y="318" font-size="10.5" font-weight="600" fill="#131210" text-anchor="middle">FREE</text>

  <!-- state chips -->
  <rect x="110" y="348" width="250" height="30" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>
  <text class="mono" x="235" y="367" font-size="10.5" fill="#5f5b50" text-anchor="middle">UNDER 10% — EVERYTHING CRAWLS</text>
  <rect x="380" y="348" width="250" height="30" fill="#131210"/>
  <text class="mono" x="505" y="367" font-size="10.5" font-weight="600" fill="#f1eee6" text-anchor="middle">OVER 10% — HEALTHY</text>

  <!-- note -->
  <text class="serif" x="110" y="436" font-size="17" fill="#5f5b50">Oldest files first — they're usually safe to move out.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">STORAGE → MANAGE · EMPTY TRASH</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">MACOS</text>
</svg>
