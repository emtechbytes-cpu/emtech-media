<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: a blue screen of death panel with the stop code highlighted, next to a three-step diagnosis checklist">
  <title>Windows — read the BSOD stop code</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 09 — WINDOWS · CRASHES</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Read the code before you panic</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">30 MIN · MEDIUM</text>

  <!-- BSOD panel -->
  <rect x="90" y="140" width="300" height="270" fill="#131210"/>
  <text class="mono" x="120" y="228" font-size="44" fill="#f1eee6">:(</text>
  <text class="mono" x="120" y="264" font-size="12" fill="rgba(241,238,230,.75)">Your PC ran into a problem</text>
  <text class="mono" x="120" y="284" font-size="12" fill="rgba(241,238,230,.75)">and needs to restart.</text>
  <rect x="110" y="330" width="260" height="52" fill="#c8f03c"/>
  <text class="mono" x="240" y="352" font-size="11" font-weight="600" fill="#131210" text-anchor="middle">DRIVER_IRQL_NOT_</text>
  <text class="mono" x="240" y="370" font-size="11" font-weight="600" fill="#131210" text-anchor="middle">LESS_OR_EQUAL</text>

  <!-- checklist -->
  <text class="mono" x="440" y="190" font-size="10" fill="#5f5b50">01</text>
  <text class="mono" x="468" y="190" font-size="10.5" fill="#131210">SEARCH THE EXACT STOP CODE —</text>
  <text class="mono" x="468" y="208" font-size="10" fill="#5f5b50">generic "BSOD fix" posts are noise</text>

  <text class="mono" x="440" y="252" font-size="10" fill="#5f5b50">02</text>
  <text class="mono" x="468" y="252" font-size="10.5" fill="#131210">ROLL BACK THE RECENT DRIVER</text>
  <text class="mono" x="468" y="270" font-size="10" fill="#5f5b50">OR UPDATE THAT PRECEDED IT</text>

  <text class="mono" x="440" y="312" font-size="10" fill="#5f5b50">03</text>
  <text class="mono" x="468" y="312" font-size="10.5" fill="#131210">EVENT VIEWER → SYSTEM LOG,</text>
  <text class="mono" x="468" y="330" font-size="10" fill="#5f5b50">MINUTES BEFORE EACH CRASH</text>

  <!-- note -->
  <text class="serif" x="440" y="402" font-size="17" fill="#5f5b50">Random crashes across drivers? Test the RAM.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">STOP CODE · UPDATE HISTORY · EVENTS</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
