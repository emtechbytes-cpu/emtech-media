<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: the NVRAM reset sequence — press power, immediately hold Command Option P R for about twenty seconds">
  <title>Mac — reset NVRAM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 14 — MAC · FIXES</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">The four-key glitch cure</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">3 MIN · EASY</text>

  <!-- power keycap -->
  <rect x="150" y="220" width="62" height="62" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <circle cx="181" cy="254" r="14" fill="none" stroke="#131210" stroke-width="2.5"/>
  <line x1="181" y1="236" x2="181" y2="252" stroke="#f7f5ee" stroke-width="6"/>
  <line x1="181" y1="234" x2="181" y2="250" stroke="#131210" stroke-width="2.5"/>
  <text class="mono" x="181" y="306" font-size="9.5" letter-spacing="1" fill="#5f5b50" text-anchor="middle">PRESS POWER</text>

  <!-- arrow -->
  <line x1="232" y1="251" x2="288" y2="251" stroke="#131210" stroke-width="2"/>
  <line x1="288" y1="251" x2="278" y2="245" stroke="#131210" stroke-width="2"/>
  <line x1="288" y1="251" x2="278" y2="257" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="260" y="234" font-size="9.5" fill="#5f5b50" text-anchor="middle">IMMEDIATELY</text>

  <!-- keycaps -->
  <rect x="300" y="220" width="62" height="62" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="331" y="259" font-size="18" fill="#131210" text-anchor="middle">Cmd</text>
  <rect x="374" y="220" width="62" height="62" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="405" y="259" font-size="18" fill="#131210" text-anchor="middle">Opt</text>
  <rect x="448" y="220" width="62" height="62" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="479" y="259" font-size="20" fill="#131210" text-anchor="middle">P</text>
  <rect x="522" y="220" width="62" height="62" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="553" y="259" font-size="20" fill="#131210" text-anchor="middle">R</text>

  <!-- hold chip -->
  <rect x="300" y="320" width="284" height="30" fill="#c8f03c"/>
  <text class="mono" x="442" y="340" font-size="11" font-weight="600" letter-spacing="1" fill="#131210" text-anchor="middle">HOLD FOR ~20 SECONDS</text>

  <!-- note -->
  <text class="serif" x="442" y="400" font-size="18" fill="#5f5b50" text-anchor="middle">release at the second chime — then boot normally.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SHUT DOWN → POWER + KEYS</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">INTEL MACS</text>
</svg>
