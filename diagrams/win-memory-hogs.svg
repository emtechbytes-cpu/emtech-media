<rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><rect x="84" y="163" width="632" height="42" fill="#c8f03c"/><text class="mono" x="102" y="188" font-size="12" font-weight="600" fill="#131210">1</text><text class="mono" x="132" y="188" font-size="12.5" font-weight="600" fill="#131210">Sort Processes by Memory — close the top</text><text class="mono" x="102" y="244" font-size="12" font-weight="600" fill="#5f5b50">2</text><text class="mono" x="132" y="244" font-size="12.5" fill="#131210">Background app permissions → off</text><text class="mono" x="102" y="300" font-size="12" font-weight="600" fill="#5f5b50">3</text><text class="mono" x="132" y="300" font-size="12.5" fill="#131210">Perfmon: Private Bytes climbing?</text><text class="mono" x="102" y="356" font-size="12" font-weight="600" fill="#5f5b50">4</text><text class="mono" x="132" y="356" font-size="12.5" fill="#131210">Pagefile 1.5×–3× RAM</text><text class="mono" x="102" y="412" font-size="12" font-weight="600" fill="#5f5b50">5</text><text class="mono" x="132" y="412" font-size="12.5" fill="#131210">Full scan — malware hides as hogs</text>

