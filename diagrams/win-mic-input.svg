<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: the Windows Sound settings input panel with a microphone level meter, an output-style device list where the USB headset is highlighted, and a privacy toggle showing microphone access is on">
  <title>Windows — fix a silent microphone</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 19 — WINDOWS · INPUT</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">It's usually the wrong input</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

  <!-- settings window -->
  <rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="88" y="132" width="10" height="10" fill="#131210"/>
  <text class="mono" x="106" y="141" font-size="11" fill="#5f5b50">Settings — Sound · Input</text>

  <!-- microphone glyph -->
  <rect x="128" y="190" width="28" height="52" rx="14" fill="#131210"/>
  <line x1="142" y1="242" x2="142" y2="262" stroke="#131210" stroke-width="2"/>
  <line x1="120" y1="262" x2="164" y2="262" stroke="#131210" stroke-width="2"/>

  <!-- level meter -->
  <rect x="110" y="300" width="290" height="10" fill="rgba(19,18,16,.15)"/>
  <rect x="110" y="300" width="203" height="10" fill="#131210"/>
  <rect x="304" y="295" width="20" height="20" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="110" y="338" font-size="9.5" letter-spacing="1" fill="#5f5b50">TALK — THE BAR SHOULD MOVE</text>

  <!-- input list -->
  <text class="mono" x="430" y="228" font-size="9" letter-spacing="1" fill="#5f5b50">INPUT DEVICE</text>
  <line x1="430" y1="236" x2="710" y2="236" stroke="rgba(19,18,16,.18)" stroke-width="1"/>

  <text class="mono" x="444" y="266" font-size="12" fill="#5f5b50">LAPTOP MIC — BUILT-IN</text>

  <!-- highlighted device -->
  <rect x="430" y="282" width="280" height="36" fill="#c8f03c"/>
  <polygon points="424,295 414,289 414,301" fill="#131210"/>
  <text class="mono" x="444" y="306" font-size="12" font-weight="600" fill="#131210">HEADSET — USB</text>

  <text class="mono" x="444" y="348" font-size="12" fill="#5f5b50">LINE IN — FRONT PANEL</text>
  <text class="mono" x="710" y="276" font-size="10" font-weight="600" fill="#131210" text-anchor="end">← pick this one</text>

  <!-- privacy row -->
  <line x1="430" y1="380" x2="710" y2="380" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="430" y="392" width="44" height="22" rx="11" fill="#131210"/>
  <circle cx="463" cy="403" r="8" fill="#f1eee6"/>
  <text class="mono" x="486" y="407" font-size="9.5" letter-spacing="1" fill="#5f5b50">ACCESS ON · YOUR APP IS ALLOWED</text>

  <!-- note -->
  <text class="serif" x="110" y="436" font-size="17" fill="#5f5b50">Teams, Zoom and Discord each remember their own input device.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SYSTEM → SOUND → INPUT · PRIVACY &amp; SECURITY → MICROPHONE</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
