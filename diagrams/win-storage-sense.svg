<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: Windows Settings storage view with the temp and cache segment highlighted, showing what Storage Sense clears automatically">
  <title>Windows — see where your space goes</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <!-- plate -->
  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <!-- header -->
  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 01 — WINDOWS · CLEANING</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">See where your space goes</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">2 MIN · EASY</text>

  <!-- settings window -->
  <rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <!-- title bar -->
  <line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="88" y="132" width="10" height="10" fill="#131210"/>
  <text class="mono" x="106" y="141" font-size="11" fill="#5f5b50">Settings</text>
  <line x1="668" y1="137" x2="682" y2="137" stroke="#131210" stroke-width="1.5"/>
  <rect x="692" y="131" width="12" height="12" fill="none" stroke="#131210" stroke-width="1.5"/>
  <line x1="714" y1="131" x2="726" y2="143" stroke="#131210" stroke-width="1.5"/>
  <line x1="726" y1="131" x2="714" y2="143" stroke="#131210" stroke-width="1.5"/>

  <!-- sidebar -->
  <line x1="250" y1="154" x2="250" y2="450" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="90" y="180" width="110" height="9" fill="rgba(19,18,16,.22)"/>
  <rect x="90" y="206" width="110" height="9" fill="rgba(19,18,16,.22)"/>
  <rect x="90" y="232" width="110" height="9" fill="#131210"/>
  <rect x="90" y="258" width="110" height="9" fill="rgba(19,18,16,.22)"/>
  <rect x="90" y="284" width="110" height="9" fill="rgba(19,18,16,.22)"/>
  <rect x="90" y="310" width="110" height="9" fill="rgba(19,18,16,.22)"/>

  <!-- main content -->
  <text class="serif" x="280" y="198" font-size="20" fill="#131210">Storage</text>
  <text class="mono" x="700" y="196" font-size="10.5" fill="#5f5b50" text-anchor="end">C: · 512 GB</text>

  <!-- storage bar -->
  <rect x="280" y="224" width="143" height="46" fill="#131210"/>
  <rect x="423" y="224" width="113" height="46" fill="rgba(19,18,16,.55)"/>
  <rect x="536" y="224" width="80" height="46" fill="rgba(19,18,16,.28)"/>
  <rect x="616" y="224" width="84" height="46" fill="#c8f03c" stroke="#131210" stroke-width="2"/>

  <!-- bar labels -->
  <text class="mono" x="351" y="292" font-size="10.5" fill="#5f5b50" text-anchor="middle">SYSTEM</text>
  <text class="mono" x="479" y="292" font-size="10.5" fill="#5f5b50" text-anchor="middle">APPS</text>
  <text class="mono" x="576" y="292" font-size="10.5" fill="#5f5b50" text-anchor="middle">FILES</text>
  <text class="mono" x="658" y="292" font-size="10.5" font-weight="600" fill="#131210" text-anchor="middle">TEMP · CACHE</text>
  <text class="mono" x="700" y="310" font-size="10" font-weight="600" fill="#131210" text-anchor="end">auto-cleared by Storage Sense</text>

  <!-- actions -->
  <rect x="280" y="360" width="140" height="42" fill="#c8f03c"/>
  <text class="mono" x="350" y="386" font-size="12" font-weight="600" fill="#131210" text-anchor="middle">Clean now ↗</text>

  <rect x="436" y="360" width="170" height="42" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="521" y="386" font-size="12" fill="#131210" text-anchor="middle">Change schedule</text>

  <!-- toggle: Storage Sense ON -->
  <rect x="630" y="371" width="48" height="24" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <rect x="658" y="374" width="18" height="18" fill="#c8f03c"/>
  <text class="mono" x="654" y="420" font-size="9" letter-spacing="1" fill="#5f5b50" text-anchor="middle">STORAGE SENSE · ON</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SETTINGS → SYSTEM → STORAGE</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
