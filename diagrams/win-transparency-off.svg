<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 26 — WINDOWS · SPEED</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">Turn off what you can't see</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">2 MIN · EASY</text>

<rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/><rect x="88" y="132" width="10" height="10" fill="#131210"/><text class="mono" x="106" y="141" font-size="11" fill="#5f5b50">Settings — Visual effects</text><line x1="668" y1="137" x2="682" y2="137" stroke="#131210" stroke-width="1.5"/><line x1="700" y1="131" x2="712" y2="143"/><line x1="712" y1="131" x2="700" y2="143"/><rect x="84" y="237" width="632" height="38" fill="#c8f03c"/><text class="mono" x="96" y="260" font-size="12" font-weight="600" fill="#131210">Transparency effects</text><rect x="666.5" y="245" width="39.5" height="22" fill="none" stroke="#131210" stroke-width="1.5"/><text class="mono" x="686.25" y="259.5" font-size="9.5" font-weight="600" fill="#131210" text-anchor="middle">OFF</text><text class="mono" x="96" y="310" font-size="12" fill="#131210">Animation effects</text><rect x="666.5" y="295" width="39.5" height="22" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="686.25" y="309.5" font-size="9.5" fill="#131210" text-anchor="middle">OFF</text><text class="mono" x="96" y="360" font-size="12" fill="#131210">Performance options</text><rect x="660" y="345" width="46" height="22" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="683" y="359.5" font-size="9.5" fill="#131210" text-anchor="middle">BEST</text>

