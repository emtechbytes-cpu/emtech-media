<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: Task Manager startup apps list with one app highlighted and a right-click menu showing Disable">
  <title>Windows — disable startup bloat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 03 — WINDOWS · SPEED</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Trim what boots with you</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">2 MIN · EASY</text>

  <!-- task manager window -->
  <rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="88" y="132" width="10" height="10" fill="#131210"/>
  <text class="mono" x="106" y="141" font-size="11" fill="#5f5b50">Task Manager</text>
  <line x1="668" y1="137" x2="682" y2="137" stroke="#131210" stroke-width="1.5"/>
  <rect x="692" y="131" width="12" height="12" fill="none" stroke="#131210" stroke-width="1.5"/>
  <line x1="714" y1="131" x2="726" y2="143" stroke="#131210" stroke-width="1.5"/>
  <line x1="726" y1="131" x2="714" y2="143" stroke="#131210" stroke-width="1.5"/>

  <!-- tabs -->
  <text class="mono" x="90" y="180" font-size="10.5" fill="#5f5b50">PROCESSES</text>
  <text class="mono" x="200" y="180" font-size="10.5" fill="#5f5b50">PERFORMANCE</text>
  <text class="mono" x="340" y="180" font-size="10.5" font-weight="600" fill="#131210">STARTUP APPS</text>
  <rect x="340" y="186" width="92" height="3" fill="#131210"/>
  <text class="mono" x="470" y="180" font-size="10.5" fill="#5f5b50">SERVICES</text>

  <!-- list header -->
  <text class="mono" x="100" y="212" font-size="9" letter-spacing="1" fill="#5f5b50">NAME</text>
  <text class="mono" x="640" y="212" font-size="9" letter-spacing="1" fill="#5f5b50" text-anchor="end">STATUS</text>
  <line x1="90" y1="220" x2="710" y2="220" stroke="rgba(19,18,16,.18)" stroke-width="1"/>

  <!-- rows -->
  <rect x="100" y="234" width="10" height="10" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="122" y="247" font-size="12" fill="#131210">OneDrive</text>
  <rect x="580" y="232" width="44" height="20" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>
  <text class="mono" x="602" y="246" font-size="9.5" fill="#131210" text-anchor="middle">ON</text>

  <!-- highlighted row -->
  <rect x="90" y="278" width="620" height="34" fill="#c8f03c"/>
  <rect x="100" y="288" width="10" height="10" fill="#131210"/>
  <text class="mono" x="122" y="301" font-size="12" font-weight="600" fill="#131210">Spotify</text>
  <rect x="580" y="284" width="44" height="20" fill="none" stroke="#131210" stroke-width="1.5"/>
  <text class="mono" x="602" y="298" font-size="9.5" font-weight="600" fill="#131210" text-anchor="middle">ON</text>

  <rect x="100" y="334" width="10" height="10" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="122" y="347" font-size="12" fill="#131210">Teams</text>
  <rect x="580" y="332" width="44" height="20" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>
  <text class="mono" x="602" y="346" font-size="9.5" fill="#131210" text-anchor="middle">ON</text>

  <rect x="100" y="378" width="10" height="10" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="122" y="391" font-size="12" fill="#131210">Dropbox</text>
  <rect x="580" y="376" width="44" height="20" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/>
  <text class="mono" x="602" y="390" font-size="9.5" fill="#5f5b50" text-anchor="middle">OFF</text>

  <!-- context menu -->
  <rect x="446" y="318" width="200" height="118" fill="rgba(19,18,16,.10)"/>
  <rect x="438" y="310" width="200" height="118" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="438" y="304" font-size="9.5" font-weight="600" fill="#131210">right-click →</text>
  <rect x="439" y="318" width="198" height="30" fill="#c8f03c"/>
  <text class="mono" x="452" y="338" font-size="11.5" font-weight="600" fill="#131210">Disable</text>
  <text class="mono" x="452" y="370" font-size="11.5" fill="#131210">Enable</text>
  <line x1="452" y1="382" x2="624" y2="382" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="452" y="404" font-size="11.5" fill="#131210">Open file location</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">TASK MANAGER → STARTUP APPS</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
