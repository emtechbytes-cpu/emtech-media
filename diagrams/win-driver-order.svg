<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 29 — WINDOWS · MAINTENANCE</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">Update in the right order</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">15 MIN · EASY</text>

<rect x="136.5" y="130" width="53" height="20" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="163" y="144" font-size="9.5" font-weight="600" fill="#131210" text-anchor="middle">FIRST</text><rect x="377" y="130" width="46" height="20" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="400" y="144" font-size="9.5" font-weight="600" fill="#131210" text-anchor="middle">THEN</text><rect x="610.5" y="130" width="53" height="20" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="637" y="144" font-size="9.5" font-weight="600" fill="#131210" text-anchor="middle">AVOID</text><rect x="70" y="170" width="186" height="170" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="86" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">GPU</text><text class="mono" x="86" y="234" font-size="13" font-weight="600" fill="#131210">maker's tool —</text><text class="mono" x="86" y="258" font-size="11" fill="#5f5b50">not Win Update</text><line x1="261" y1="255" x2="302" y2="255" stroke="#131210" stroke-width="1.5"/><path d="M 295 251 L 302 255 L 295 259" fill="none" stroke="#131210" stroke-width="1.5"/><rect x="307" y="170" width="186" height="170" fill="#c8f03c" stroke="#131210" stroke-width="2"/><text class="mono" x="323" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">CHIPSET + AUDIO</text><text class="mono" x="323" y="234" font-size="13" font-weight="600" fill="#131210">OEM support page</text><text class="mono" x="323" y="258" font-size="11" fill="#5f5b50">only safe source</text><line x1="498" y1="255" x2="539" y2="255" stroke="#131210" stroke-width="1.5"/><path d="M 532 251 L 539 255 L 532 259" fill="none" stroke="#131210" stroke-width="1.5"/><rect x="544" y="170" width="186" height="170" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="560" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">UPDATERS</text><text class="mono" x="560" y="234" font-size="13" font-weight="600" fill="#131210">third-party tools</text><text class="mono" x="560" y="258" font-size="11" fill="#5f5b50">mostly adware ✕</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
