<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: 'Dead' is usually one boring thing">
  <title>Windows — 'Dead' is usually one boring thing</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 76 — WINDOWS · MAINTENANCE</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">'Dead' is usually one boring thing</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

<rect x="70" y="120" width="430" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><rect x="84" y="187" width="402" height="44" fill="#c8f03c"/><text class="mono" x="102" y="213" font-size="12" font-weight="600" fill="#131210">1</text><text class="mono" x="132" y="213" font-size="12.5" font-weight="600" fill="#131210">Socket · cable · PSU rocker switch</text><text class="mono" x="102" y="271" font-size="12" font-weight="600" fill="#5f5b50">2</text><text class="mono" x="132" y="271" font-size="12.5" fill="#131210">Standby light? alive = display problem</text><text class="mono" x="102" y="329" font-size="12" font-weight="600" fill="#5f5b50">3</text><text class="mono" x="132" y="329" font-size="12.5" fill="#131210">Laptop: charger LED, boot on battery</text><text class="mono" x="102" y="387" font-size="12" font-weight="600" fill="#5f5b50">4</text><text class="mono" x="132" y="387" font-size="12.5" fill="#131210">Drain: unplug 30 s + hold power 15 s</text>
<rect x="520" y="170" width="210" height="118" fill="#f7f5ee" stroke="rgba(19,18,16,.18)" stroke-width="1.5"/>
<text class="mono" x="536" y="198" font-size="9.5" font-weight="600" letter-spacing="1" fill="#131210">PROMISE</text><text class="mono" x="536" y="220" font-size="11" fill="#5f5b50">nothing here</text><text class="mono" x="536" y="238" font-size="11" fill="#5f5b50">can damage it</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
<text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SOCKET · CABLE · SWITCH · DRAIN — FIVE MINUTES</text>
</svg>
