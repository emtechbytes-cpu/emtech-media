<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: a four-row Windows 11 requirements checklist — CPU, RAM, TPM 2.0 and Secure Boot with status chips marking the two that are often just switched off, above a lime action bar pointing to the BIOS fix">
  <title>Windows — check for Windows 11</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 22 — WINDOWS · UPGRADE</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Usually fitted, simply switched off</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">10 MIN · MEDIUM</text>

  <!-- checklist panel -->
  <rect x="70" y="120" width="660" height="250" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="88" y="132" width="10" height="10" fill="#131210"/>
  <text class="mono" x="106" y="141" font-size="11" fill="#5f5b50">PC HEALTH CHECK — THE FOUR GATES</text>

  <!-- row: CPU -->
  <text class="mono" x="90" y="192" font-size="11" font-weight="600" fill="#131210">CPU</text>
  <text class="mono" x="250" y="192" font-size="9.5" fill="#5f5b50">8th-gen Intel · Ryzen 2000+</text>
  <rect x="560" y="174" width="150" height="28" fill="none" stroke="rgba(19,18,16,.35)" stroke-width="1"/>
  <text class="mono" x="635" y="192" font-size="9.5" letter-spacing="1" fill="#5f5b50" text-anchor="middle">USUALLY PASSES</text>
  <line x1="90" y1="216" x2="710" y2="216" stroke="rgba(19,18,16,.18)" stroke-width="1"/>

  <!-- row: RAM -->
  <text class="mono" x="90" y="242" font-size="11" font-weight="600" fill="#131210">RAM</text>
  <text class="mono" x="250" y="242" font-size="9.5" fill="#5f5b50">4 GB minimum — most pass</text>
  <rect x="560" y="224" width="150" height="28" fill="none" stroke="rgba(19,18,16,.35)" stroke-width="1"/>
  <text class="mono" x="635" y="242" font-size="9.5" letter-spacing="1" fill="#5f5b50" text-anchor="middle">USUALLY PASSES</text>
  <line x1="90" y1="266" x2="710" y2="266" stroke="rgba(19,18,16,.18)" stroke-width="1"/>

  <!-- row: TPM -->
  <text class="mono" x="90" y="292" font-size="11" font-weight="600" fill="#131210">TPM 2.0</text>
  <text class="mono" x="250" y="292" font-size="9.5" fill="#5f5b50">tpm.msc → 'ready for use'</text>
  <rect x="560" y="274" width="150" height="28" fill="none" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="635" y="292" font-size="9.5" letter-spacing="1" font-weight="600" fill="#131210" text-anchor="middle">OFTEN OFF</text>
  <line x1="90" y1="316" x2="710" y2="316" stroke="rgba(19,18,16,.18)" stroke-width="1"/>

  <!-- row: Secure Boot -->
  <text class="mono" x="90" y="342" font-size="11" font-weight="600" fill="#131210">SECURE BOOT</text>
  <text class="mono" x="250" y="342" font-size="9.5" fill="#5f5b50">msinfo32 → System Summary</text>
  <rect x="560" y="324" width="150" height="28" fill="none" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="635" y="342" font-size="9.5" letter-spacing="1" font-weight="600" fill="#131210" text-anchor="middle">OFTEN OFF</text>

  <!-- action bar -->
  <rect x="70" y="386" width="660" height="44" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="90" y="413" font-size="11" letter-spacing="1" font-weight="600" fill="#131210">THE FIX — BIOS/UEFI → ENABLE PTT (INTEL) / fTPM (AMD) + SECURE BOOT</text>

  <!-- note -->
  <text class="serif" x="70" y="456" font-size="17" fill="#5f5b50">Legacy BIOS install? Convert with mbr2gpt first or Secure Boot won't take.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">PC HEALTH CHECK → TPM.MSC → MSINFO32 → BIOS/UEFI</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
