<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: Privacy and Security settings list with the FileVault row highlighted and protection switched on">
  <title>Mac — turn on FileVault</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 16 — MAC · SECURITY</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">One click between you and identity theft</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">3 MIN · EASY</text>

  <!-- mac window -->
  <rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="90" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <rect x="104" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <rect x="118" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <text class="mono" x="400" y="142" font-size="11" fill="#5f5b50" text-anchor="middle">System Settings — Privacy &amp; Security</text>

  <!-- heading -->
  <text class="serif" x="110" y="202" font-size="20" fill="#131210">Full-disk encryption</text>
  <text class="mono" x="690" y="200" font-size="10.5" fill="#5f5b50" text-anchor="end">IF THE MAC IS GONE, SO IS YOUR DATA</text>

  <!-- settings rows -->
  <rect x="110" y="237" width="12" height="12" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="136" y="249" font-size="12.5" fill="#5f5b50">Sharing</text>

  <!-- highlighted FileVault row -->
  <rect x="90" y="278" width="620" height="40" fill="#c8f03c"/>
  <!-- lock glyph -->
  <rect x="110" y="296" width="16" height="12" fill="#131210"/>
  <path d="M 113 296 v -5 a 5.5 5.5 0 0 1 11 0 v 5" fill="none" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="140" y="303" font-size="12.5" font-weight="600" fill="#131210">FileVault</text>
  <!-- toggle ON -->
  <rect x="630" y="287" width="48" height="24" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <rect x="658" y="290" width="18" height="18" fill="#131210"/>

  <rect x="110" y="341" width="12" height="12" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="136" y="353" font-size="12.5" fill="#5f5b50">Login Options</text>

  <!-- note -->
  <text class="serif" x="110" y="436" font-size="17" fill="#5f5b50">Pick a recovery key? Store it somewhere that isn't this Mac.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">PRIVACY &amp; SECURITY → FILEVAULT</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">MACOS</text>
</svg>
