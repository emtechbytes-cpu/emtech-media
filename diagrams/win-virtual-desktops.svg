<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: One job per desktop">
  <title>Windows — One job per desktop</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 62 — WINDOWS · WINDOWS</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">One job per desktop</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

<rect x="70" y="170" width="186" height="170" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="86" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">CREATE</text><text class="mono" x="86" y="234" font-size="13" font-weight="600" fill="#131210">Win + Ctrl + D</text><text class="mono" x="86" y="258" font-size="11" fill="#5f5b50">new desktop</text><line x1="261" y1="255" x2="302" y2="255" stroke="#131210" stroke-width="1.5"/><path d="M 295 251 L 302 255 L 295 259" fill="none" stroke="#131210" stroke-width="1.5"/><rect x="307" y="170" width="186" height="170" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="323" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">ARRANGE</text><text class="mono" x="323" y="234" font-size="13" font-weight="600" fill="#131210">Open with Win+Tab</text><text class="mono" x="323" y="258" font-size="11" fill="#5f5b50">move windows over</text><line x1="498" y1="255" x2="539" y2="255" stroke="#131210" stroke-width="1.5"/><path d="M 532 251 L 539 255 L 532 259" fill="none" stroke="#131210" stroke-width="1.5"/><rect x="544" y="170" width="186" height="170" fill="#c8f03c" stroke="#131210" stroke-width="2"/><text class="mono" x="560" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">FOCUS</text><text class="mono" x="560" y="234" font-size="13" font-weight="600" fill="#131210">work / research /</text><text class="mono" x="560" y="258" font-size="11" fill="#5f5b50">music — no mixing</text>
<rect x="70" y="380" width="660" height="44" fill="#f7f5ee" stroke="rgba(19,18,16,.18)" stroke-width="1.5"/>
<text class="mono" x="90" y="408" font-size="11.5" fill="#5f5b50">Win + Ctrl + F4 closes the current desktop</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
<text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">WIN+CTRL+D · WIN+TAB · ONE JOB PER DESKTOP</text>
</svg>
