<rect x="70" y="120" width="430" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><line x1="70" y1="154" x2="500" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/><rect x="88" y="132" width="10" height="10" fill="#131210"/><text class="mono" x="106" y="141" font-size="11" fill="#5f5b50">PowerToys — the useful five</text><line x1="438" y1="137" x2="452" y2="137" stroke="#131210" stroke-width="1.5"/><line x1="470" y1="131" x2="482" y2="143"/><line x1="482" y1="131" x2="470" y2="143"/><rect x="84" y="187" width="402" height="38" fill="#c8f03c"/><text class="mono" x="96" y="210" font-size="12" font-weight="600" fill="#131210">PowerToys Run</text><rect x="397.5" y="195" width="78.5" height="22" fill="none" stroke="#131210" stroke-width="1.5"/><text class="mono" x="436.75" y="209.5" font-size="9.5" font-weight="600" fill="#131210" text-anchor="middle">ALT+SPACE</text><text class="mono" x="96" y="260" font-size="12" fill="#131210">FancyZones</text><rect x="410.5" y="245" width="65.5" height="22" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="443.25" y="259.5" font-size="9.5" fill="#131210" text-anchor="middle">LAYOUTS</text><text class="mono" x="96" y="310" font-size="12" fill="#131210">Awake</text><rect x="404" y="295" width="72" height="22" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="440" y="309.5" font-size="9.5" fill="#131210" text-anchor="middle">NO SLEEP</text><text class="mono" x="96" y="360" font-size="12" fill="#131210">Color Picker</text><rect x="384.5" y="345" width="91.5" height="22" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="430.25" y="359.5" font-size="9.5" fill="#131210" text-anchor="middle">WIN+SHIFT+C</text><text class="mono" x="96" y="410" font-size="12" fill="#131210">Text Extractor</text><rect x="384.5" y="395" width="91.5" height="22" fill="none" stroke="rgba(19,18,16,.4)" stroke-width="1.5"/><text class="mono" x="430.25" y="409.5" font-size="9.5" fill="#131210" text-anchor="middle">WIN+SHIFT+T</text>
<rect x="520" y="170" width="210" height="118" fill="#f7f5ee" stroke="rgba(19,18,16,.18)" stroke-width="1.5"/>
<text class="mono" x="536" y="198" font-size="9.5" font-weight="600" letter-spacing="1" fill="#131210">GET IT FROM</text><text class="mono" x="536" y="220" font-size="11" fill="#5f5b50">Microsoft Store</text><text class="mono" x="536" y="238" font-size="11" fill="#5f5b50">or GitHub — only</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
<text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">OFFICIAL · FREE · BETTER THAN MOST PAID TOOLS</text>
