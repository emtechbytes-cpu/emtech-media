<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: macOS menu bar with the Apple menu open, Force Quit highlighted, and the Command-Option-Esc shortcut shown as keycaps">
  <title>Mac — kill a frozen app</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
    .sans { font-family: Inter, system-ui, sans-serif; }
  </style>

  <!-- plate -->
  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <!-- header -->
  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 02 — MAC · FIXES</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Kill the freeze, keep your work</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">1 MIN · EASY</text>

  <!-- menu bar -->
  <rect x="70" y="130" width="660" height="44" fill="#131210"/>
  <!-- apple roundel (abstract) -->
  <circle cx="96" cy="154" r="8" fill="#f1eee6"/>
  <path d="M 97 145 q 3 -7 10 -8 q -1 8 -10 8 z" fill="#f1eee6"/>
  <!-- app name + menus -->
  <text class="sans" x="116" y="158" font-size="14" font-weight="600" fill="#f1eee6">Figma</text>
  <text class="sans" x="192" y="157" font-size="12.5" fill="rgba(241,238,230,.75)">File</text>
  <text class="sans" x="232" y="157" font-size="12.5" fill="rgba(241,238,230,.75)">Edit</text>
  <text class="sans" x="272" y="157" font-size="12.5" fill="rgba(241,238,230,.75)">View</text>
  <text class="sans" x="318" y="157" font-size="12.5" fill="rgba(241,238,230,.75)">Window</text>
  <text class="sans" x="386" y="157" font-size="12.5" fill="rgba(241,238,230,.75)">Help</text>
  <!-- status icons -->
  <rect x="628" y="146" width="26" height="13" fill="none" stroke="rgba(241,238,230,.75)" stroke-width="1.5"/>
  <rect x="655" y="150" width="3" height="5" fill="rgba(241,238,230,.75)"/>
  <rect x="630" y="148" width="16" height="9" fill="#f1eee6"/>
  <path d="M 674 152 a 12 12 0 0 1 16 0" fill="none" stroke="rgba(241,238,230,.75)" stroke-width="1.5"/>
  <path d="M 677 156 a 8 8 0 0 1 10 0" fill="none" stroke="rgba(241,238,230,.75)" stroke-width="1.5"/>
  <circle cx="682" cy="159" r="1.8" fill="#f1eee6"/>
  <text class="mono" x="722" y="157" font-size="11" fill="#f1eee6" text-anchor="end">9:41 AM</text>

  <!-- dropdown shadow + panel -->
  <rect x="78" y="202" width="290" height="246" fill="rgba(19,18,16,.10)"/>
  <rect x="70" y="194" width="290" height="246" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>

  <!-- menu rows -->
  <text class="mono" x="88" y="224" font-size="12.5" fill="#131210">About This Mac</text>
  <line x1="86" y1="240" x2="344" y2="240" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="88" y="262" font-size="12.5" fill="#131210">System Settings…</text>
  <text class="mono" x="88" y="296" font-size="12.5" fill="#131210">App Store…</text>
  <line x1="86" y1="312" x2="344" y2="312" stroke="rgba(19,18,16,.18)" stroke-width="1"/>

  <!-- highlighted row -->
  <rect x="71" y="322" width="288" height="38" fill="#c8f03c"/>
  <text class="mono" x="88" y="346" font-size="12.5" font-weight="600" fill="#131210">Force Quit Figma…</text>
  <!-- keycaps in row -->
  <rect x="252" y="329" width="22" height="22" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <text class="mono" x="263" y="344" font-size="8" fill="#131210" text-anchor="middle">CMD</text>
  <rect x="278" y="329" width="22" height="22" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <text class="mono" x="289" y="344" font-size="8" fill="#131210" text-anchor="middle">OPT</text>
  <rect x="304" y="329" width="22" height="22" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <text class="mono" x="315" y="344" font-size="8.5" fill="#131210" text-anchor="middle">Esc</text>

  <text class="mono" x="88" y="386" font-size="12.5" fill="#131210">Sleep</text>
  <text class="mono" x="88" y="420" font-size="12.5" fill="#131210">Restart…</text>

  <!-- right column: problem → action -->
  <!-- beachball (spinning wheel) -->
  <circle cx="504" cy="250" r="30" fill="none" stroke="#131210" stroke-width="2"/>
  <line x1="504" y1="222" x2="504" y2="278" stroke="#131210" stroke-width="1.5"/>
  <line x1="476" y1="250" x2="532" y2="250" stroke="#131210" stroke-width="1.5"/>
  <line x1="484" y1="230" x2="524" y2="270" stroke="#131210" stroke-width="1.5"/>
  <line x1="524" y1="230" x2="484" y2="270" stroke="#131210" stroke-width="1.5"/>
  <circle cx="504" cy="250" r="4" fill="#131210"/>
  <text class="mono" x="504" y="308" font-size="10.5" fill="#5f5b50" text-anchor="middle">the beachball = it's stuck</text>

  <!-- big keycaps -->
  <rect x="422" y="330" width="52" height="52" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="448" y="362" font-size="15" fill="#131210" text-anchor="middle">Cmd</text>
  <rect x="482" y="330" width="52" height="52" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="508" y="362" font-size="15" fill="#131210" text-anchor="middle">Opt</text>
  <rect x="542" y="330" width="52" height="52" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="568" y="362" font-size="14" fill="#131210" text-anchor="middle">Esc</text>

  <!-- note -->
  <text class="serif" x="504" y="432" font-size="19" fill="#5f5b50" text-anchor="middle">One press — no restart needed.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">APPLE MENU → FORCE QUIT</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">MACOS 12+</text>
</svg>
