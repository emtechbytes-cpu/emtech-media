<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: a four-station escalation pipeline for a printer that won't print — stuck queue highlighted, then spooler reset, default printer switch, and re-adding the device">
  <title>Windows — fix a silent printer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 21 — WINDOWS · PRINTING</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">It's the queue, not the printer</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">10 MIN · EASY</text>

  <!-- station 1 — highlighted -->
  <rect x="70" y="170" width="145" height="96" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="84" y="198" font-size="13" font-weight="600" fill="#131210">1</text>
  <text class="mono" x="104" y="198" font-size="10.5" font-weight="600" fill="#131210">STUCK QUEUE</text>
  <text class="mono" x="84" y="222" font-size="9" fill="#131210">cancel all jobs</text>
  <text class="mono" x="84" y="238" font-size="9" fill="#131210">send a test page</text>

  <!-- arrow -->
  <line x1="217" y1="218" x2="230" y2="218" stroke="#131210" stroke-width="2"/>
  <polygon points="235,218 226,213 226,223" fill="#131210"/>

  <!-- station 2 -->
  <rect x="235" y="170" width="145" height="96" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="249" y="198" font-size="13" font-weight="600" fill="#131210">2</text>
  <text class="mono" x="269" y="198" font-size="10.5" font-weight="600" fill="#131210">SPOOLER</text>
  <text class="mono" x="249" y="222" font-size="9" fill="#5f5b50">services.msc → stop</text>
  <text class="mono" x="249" y="238" font-size="9" fill="#5f5b50">clear PRINTERS folder</text>
  <text class="mono" x="249" y="254" font-size="9" fill="#5f5b50">start it again</text>

  <!-- arrow -->
  <line x1="382" y1="218" x2="395" y2="218" stroke="#131210" stroke-width="2"/>
  <polygon points="400,218 391,213 391,223" fill="#131210"/>

  <!-- station 3 -->
  <rect x="400" y="170" width="145" height="96" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="414" y="198" font-size="13" font-weight="600" fill="#131210">3</text>
  <text class="mono" x="434" y="198" font-size="10.5" font-weight="600" fill="#131210">DEFAULT PRINTER</text>
  <text class="mono" x="414" y="222" font-size="9" fill="#5f5b50">'let Windows manage'</text>
  <text class="mono" x="414" y="238" font-size="9" fill="#5f5b50">my default' — OFF</text>

  <!-- arrow -->
  <line x1="547" y1="218" x2="560" y2="218" stroke="#131210" stroke-width="2"/>
  <polygon points="565,218 556,213 556,223" fill="#131210"/>

  <!-- station 4 -->
  <rect x="565" y="170" width="145" height="96" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="579" y="198" font-size="13" font-weight="600" fill="#131210">4</text>
  <text class="mono" x="599" y="198" font-size="10.5" font-weight="600" fill="#131210">RE-ADD IT</text>
  <text class="mono" x="579" y="222" font-size="9" fill="#5f5b50">remove + re-add it</text>
  <text class="mono" x="579" y="238" font-size="9" fill="#5f5b50">skip the bundle</text>

  <!-- note -->
  <text class="serif" x="70" y="446" font-size="17" fill="#5f5b50">Nine times out of ten it's a stuck queue or the wrong default.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">PRINTERS &amp; SCANNERS → OPEN PRINT QUEUE</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
