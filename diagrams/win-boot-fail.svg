<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: three boot failure states — dead with no lights, dark screen with spinning fans, and stuck on the Windows logo — converging into Automatic Repair where Startup Repair is highlighted, with System Restore and Safe Mode below">
  <title>Windows — fix a PC that won't start up</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 23 — WINDOWS · BOOT</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Follow the power, not the panic</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">15 MIN · MEDIUM</text>

  <!-- state 1 -->
  <rect x="70" y="130" width="240" height="62" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="86" y="155" font-size="11" font-weight="600" fill="#131210">DEAD — NO LIGHTS</text>
  <text class="mono" x="86" y="175" font-size="9.5" fill="#5f5b50">socket · cable · PSU switch first</text>

  <!-- state 2 -->
  <rect x="70" y="214" width="240" height="62" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="86" y="239" font-size="11" font-weight="600" fill="#131210">DARK SCREEN, FANS SPIN</text>
  <text class="mono" x="86" y="259" font-size="9.5" fill="#5f5b50">try another monitor or cable</text>

  <!-- state 3 -->
  <rect x="70" y="298" width="240" height="62" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="86" y="323" font-size="11" font-weight="600" fill="#131210">STUCK ON THE LOGO</text>
  <text class="mono" x="86" y="343" font-size="9.5" fill="#5f5b50">power-cut at boot ×3 — 4th try wins</text>

  <!-- converging arrows -->
  <line x1="312" y1="161" x2="382" y2="252" stroke="#131210" stroke-width="2"/>
  <polygon points="390,254 376,246 378,258" fill="#131210"/>
  <line x1="312" y1="245" x2="382" y2="268" stroke="#131210" stroke-width="2"/>
  <polygon points="390,270 376,262 378,274" fill="#131210"/>
  <line x1="312" y1="329" x2="382" y2="284" stroke="#131210" stroke-width="2"/>
  <polygon points="390,286 376,278 378,290" fill="#131210"/>

  <!-- recovery panel -->
  <rect x="390" y="120" width="340" height="300" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="390" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="408" y="132" width="10" height="10" fill="#131210"/>
  <text class="mono" x="426" y="141" font-size="11" fill="#5f5b50">AUTOMATIC REPAIR — ADVANCED OPTIONS</text>

  <!-- startup repair — highlighted -->
  <rect x="408" y="176" width="304" height="56" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="424" y="198" font-size="11" font-weight="600" fill="#131210">STARTUP REPAIR</text>
  <text class="mono" x="424" y="218" font-size="9.5" fill="#131210">let it scan, then reboot and retest</text>

  <!-- system restore -->
  <rect x="408" y="252" width="304" height="56" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="424" y="274" font-size="11" font-weight="600" fill="#131210">SYSTEM RESTORE</text>
  <text class="mono" x="424" y="294" font-size="9.5" fill="#5f5b50">a point before the trouble started</text>

  <!-- safe mode -->
  <rect x="408" y="328" width="304" height="56" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <text class="mono" x="424" y="350" font-size="11" font-weight="600" fill="#131210">SAFE MODE</text>
  <text class="mono" x="424" y="370" font-size="9.5" fill="#5f5b50">uninstall what changed — see FIG. 18</text>

  <!-- note -->
  <text class="serif" x="70" y="446" font-size="17" fill="#5f5b50">Most 'dead' PCs are one small thing away from life — and your files were never in danger.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">CHECK POWER → TRY ANOTHER DISPLAY → AUTOMATIC REPAIR</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">WIN 10 / 11</text>
</svg>
