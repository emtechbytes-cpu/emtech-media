<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: Rotate through the path in order">
  <title>macOS — Rotate through the path in order</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 85 — MACOS · DISPLAY</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">Rotate through the path in order</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

<rect x="70" y="170" width="135" height="170" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="86" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">CABLE</text><text class="mono" x="86" y="234" font-size="13" font-weight="600" fill="#131210">both ends +</text><text class="mono" x="86" y="258" font-size="11" fill="#5f5b50">another port</text><line x1="210" y1="255" x2="240" y2="255" stroke="#131210" stroke-width="1.5"/><path d="M 233 251 L 240 255 L 233 259" fill="none" stroke="#131210" stroke-width="1.5"/><rect x="245" y="170" width="135" height="170" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="261" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">ADAPTER</text><text class="mono" x="261" y="234" font-size="13" font-weight="600" fill="#131210">bypass dock —</text><text class="mono" x="261" y="258" font-size="11" fill="#5f5b50">direct cable</text><line x1="385" y1="255" x2="415" y2="255" stroke="#131210" stroke-width="1.5"/><path d="M 408 251 L 415 255 L 408 259" fill="none" stroke="#131210" stroke-width="1.5"/><rect x="420" y="170" width="135" height="170" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="436" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">REPLUG</text><text class="mono" x="436" y="234" font-size="13" font-weight="600" fill="#131210">wait ~10 s,</text><text class="mono" x="436" y="258" font-size="11" fill="#5f5b50">re-detects</text><line x1="560" y1="255" x2="590" y2="255" stroke="#131210" stroke-width="1.5"/><path d="M 583 251 L 590 255 L 583 259" fill="none" stroke="#131210" stroke-width="1.5"/><rect x="595" y="170" width="135" height="170" fill="#c8f03c" stroke="#131210" stroke-width="2"/><text class="mono" x="611" y="198" font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#131210">DISPLAYS</text><text class="mono" x="611" y="234" font-size="13" font-weight="600" fill="#131210">Settings →</text><text class="mono" x="611" y="258" font-size="11" fill="#5f5b50">arrange it</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
<text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">CABLE · ADAPTER · PORT — USUALLY ONE OF THE THREE</text>
</svg>
