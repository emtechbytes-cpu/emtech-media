<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: a battery with the twenty to eighty percent charge zone highlighted as the sweet spot, and optimised battery charging switched on">
  <title>Mac — keep your battery healthy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 15 — MAC · BATTERY</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Charge smart, age slower</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

  <!-- battery -->
  <rect x="140" y="210" width="480" height="76" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <rect x="620" y="232" width="14" height="32" fill="rgba(19,18,16,.4)"/>

  <!-- charge zones -->
  <rect x="148" y="218" width="93" height="60" fill="rgba(19,18,16,.15)"/>
  <rect x="241" y="218" width="278" height="60" fill="#c8f03c" stroke="#131210" stroke-width="2"/>
  <rect x="519" y="218" width="93" height="60" fill="rgba(19,18,16,.15)"/>

  <!-- zone labels -->
  <text class="mono" x="194" y="252" font-size="9.5" fill="#5f5b50" text-anchor="middle">AVOID</text>
  <text class="mono" x="380" y="246" font-size="11" font-weight="600" letter-spacing="1" fill="#131210" text-anchor="middle">THE SWEET SPOT</text>
  <text class="mono" x="380" y="264" font-size="9.5" fill="#131210" text-anchor="middle">20% — 80%</text>
  <text class="mono" x="565" y="252" font-size="9.5" fill="#5f5b50" text-anchor="middle">AVOID</text>

  <!-- toggle -->
  <rect x="140" y="330" width="48" height="24" fill="#f1eee6" stroke="#131210" stroke-width="2"/>
  <rect x="168" y="333" width="18" height="18" fill="#131210"/>
  <text class="mono" x="204" y="347" font-size="10.5" letter-spacing="1" fill="#131210">OPTIMISED BATTERY CHARGING — ON</text>

  <!-- note -->
  <text class="serif" x="140" y="410" font-size="17" fill="#5f5b50">macOS holds below 100% until you usually unplug.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SYSTEM SETTINGS → BATTERY</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">MACOS</text>
</svg>
