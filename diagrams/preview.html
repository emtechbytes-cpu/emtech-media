<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EmTech Media — Diagram preview</title>
<style>
  :root { --paper: #f1eee6; --ink: #131210; --muted: #5f5b50; --hairline: rgba(19,18,16,.18); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; padding: 48px 24px 96px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 40px; border-bottom: 1px solid var(--ink); padding-bottom: 20px; }
  .kicker { font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; font-size: clamp(28px, 5vw, 40px); }
  .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
  h2 { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 56px 0 20px; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); color: var(--muted); }
  figure { margin: 0 0 40px; }
  figcaption { display: flex; justify-content: space-between; gap: 16px; padding-top: 10px; font-size: 12px; }
  figcaption .tip { color: var(--ink); }
  figcaption .meta { color: var(--muted); white-space: nowrap; }
  img { display: block; width: 100%; height: auto; border: 1px solid var(--hairline); background: var(--paper); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">EMTECH MEDIA · WORKING PREVIEW — NOT PART OF THE SITE</p>
    <h1>All sixteen figures, in one place</h1>
    <p class="note">Each figure appears inside its tip's accordion on the live pages. Order below matches windows.html then mac.html.</p>
  </header>

  <h2>Windows page — 8 figures</h2>

  <figure><img src="win-startup-bloat.svg" alt="" width="800" height="540"><figcaption><span class="tip">Disable startup bloat</span><span class="meta">FIG. 03 · SPEED</span></figcaption></figure>
  <figure><img src="win-power-plan.svg" alt="" width="800" height="540"><figcaption><span class="tip">Switch the power plan to Best Performance</span><span class="meta">FIG. 04 · SPEED</span></figcaption></figure>
  <figure><img src="win-active-hours.svg" alt="" width="800" height="540"><figcaption><span class="tip">Stop Windows updates at odd hours</span><span class="meta">FIG. 05 · UPDATES</span></figcaption></figure>
  <figure><img src="win-dust-cleanout.svg" alt="" width="800" height="540"><figcaption><span class="tip">Fix a PC that overheats and fans like a jet engine</span><span class="meta">FIG. 06 · MAINTENANCE</span></figcaption></figure>
  <figure><img src="win-network-test.svg" alt="" width="800" height="540"><figcaption><span class="tip">Slow internet? Run the five-minute test</span><span class="meta">FIG. 07 · NETWORK</span></figcaption></figure>
  <figure><img src="win-no-sound.svg" alt="" width="800" height="540"><figcaption><span class="tip">No sound? The four-minute fix</span><span class="meta">FIG. 08 · AUDIO</span></figcaption></figure>
  <figure><img src="win-bsod.svg" alt="" width="800" height="540"><figcaption><span class="tip">Fix a blue screen (BSOD) without panicking</span><span class="meta">FIG. 09 · CRASHES</span></figcaption></figure>
  <figure><img src="win-storage-sense.svg" alt="" width="800" height="540"><figcaption><span class="tip">Let Windows' Storage Sense do the work for you</span><span class="meta">FIG. 01 · CLEANING</span></figcaption></figure>

  <h2>Mac page — 8 figures</h2>

  <figure><img src="mac-force-quit.svg" alt="" width="800" height="540"><figcaption><span class="tip">Force-quit a frozen app</span><span class="meta">FIG. 02 · FIXES</span></figcaption></figure>
  <figure><img src="mac-storage-manage.svg" alt="" width="800" height="540"><figcaption><span class="tip">Free up disk space with Storage Management</span><span class="meta">FIG. 10 · STORAGE</span></figcaption></figure>
  <figure><img src="mac-free-space.svg" alt="" width="800" height="540"><figcaption><span class="tip">Keep 10% of your disk free</span><span class="meta">FIG. 11 · STORAGE</span></figcaption></figure>
  <figure><img src="mac-login-items.svg" alt="" width="800" height="540"><figcaption><span class="tip">Stop apps from launching at login</span><span class="meta">FIG. 12 · SPEED</span></figcaption></figure>
  <figure><img src="mac-time-machine.svg" alt="" width="800" height="540"><figcaption><span class="tip">Set up Time Machine properly</span><span class="meta">FIG. 13 · BACKUPS</span></figcaption></figure>
  <figure><img src="mac-nvram-reset.svg" alt="" width="800" height="540"><figcaption><span class="tip">Reset NVRAM when things misbehave</span><span class="meta">FIG. 14 · FIXES</span></figcaption></figure>
  <figure><img src="mac-battery-health.svg" alt="" width="800" height="540"><figcaption><span class="tip">Keep your Mac battery healthy</span><span class="meta">FIG. 15 · BATTERY</span></figcaption></figure>
  <figure><img src="mac-filevault.svg" alt="" width="800" height="540"><figcaption><span class="tip">Turn on FileVault full-disk encryption</span><span class="meta">FIG. 16 · SECURITY</span></figcaption></figure>
</div>
</body>
</html>
