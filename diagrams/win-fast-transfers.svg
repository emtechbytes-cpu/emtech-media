<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: Same bytes, half the time">
  <title>Windows — Same bytes, half the time</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 49 — WINDOWS · SPEED</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">Same bytes, half the time</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

<rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><text class="mono" x="102" y="188" font-size="12" font-weight="600" fill="#5f5b50">1</text><text class="mono" x="132" y="188" font-size="12.5" fill="#131210">SSD or HDD? Check Task Manager → Disk</text><text class="mono" x="102" y="244" font-size="12" font-weight="600" fill="#5f5b50">2</text><text class="mono" x="132" y="244" font-size="12.5" fill="#131210">USB 3.x port — blue/teal inside</text><text class="mono" x="102" y="300" font-size="12" font-weight="600" fill="#5f5b50">3</text><text class="mono" x="132" y="300" font-size="12.5" fill="#131210">FAT32? Convert to NTFS</text><rect x="84" y="331" width="632" height="42" fill="#c8f03c"/><text class="mono" x="102" y="356" font-size="12" font-weight="600" fill="#131210">4</text><text class="mono" x="132" y="356" font-size="12.5" font-weight="600" fill="#131210">Robocopy /mt:16 over drag-and-drop</text><text class="mono" x="102" y="412" font-size="12" font-weight="600" fill="#5f5b50">5</text><text class="mono" x="132" y="412" font-size="12.5" fill="#131210">Compress first when you can</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
<text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">ROBOCOPY · USB 3.X · NTFS · COMPRESS</text>
</svg>
