<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: The safe way past the block">
  <title>macOS — The safe way past the block</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

<rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

<text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 67 — MACOS · FIXES</text>
<text class="serif" x="48" y="88" font-size="30" fill="#131210">The safe way past the block</text>
<text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">2 MIN · EASY</text>

<rect x="70" y="120" width="430" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/><rect x="84" y="216" width="402" height="44" fill="#c8f03c"/><text class="mono" x="102" y="242" font-size="12" font-weight="600" fill="#131210">1</text><text class="mono" x="132" y="242" font-size="12.5" font-weight="600" fill="#131210">Right-click app → Open → confirm</text><text class="mono" x="102" y="300" font-size="12" font-weight="600" fill="#5f5b50">2</text><text class="mono" x="132" y="300" font-size="12.5" fill="#131210">Privacy &amp; Security → 'Open Anyway'</text><text class="mono" x="102" y="358" font-size="12" font-weight="600" fill="#5f5b50">3</text><text class="mono" x="132" y="358" font-size="12.5" fill="#131210">Only for apps from sources you trust</text>
<rect x="520" y="170" width="210" height="118" fill="#f7f5ee" stroke="rgba(19,18,16,.18)" stroke-width="1.5"/>
<text class="mono" x="536" y="198" font-size="9.5" font-weight="600" letter-spacing="1" fill="#131210">WHY IT EXISTS</text><text class="mono" x="536" y="220" font-size="11" fill="#5f5b50">unsigned software is</text><text class="mono" x="536" y="238" font-size="11" fill="#5f5b50">where malware hides</text>

<line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
<text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">FINDER · PRIVACY &amp; SECURITY — FIRST LAUNCH ONLY</text>
</svg>
