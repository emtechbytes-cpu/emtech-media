<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-label="Schematic diagram: macOS login items list with one app highlighted and a minus keycap showing how to remove it from startup">
  <title>Mac — stop apps launching at login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@1&amp;display=swap');
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; }
  </style>

  <rect x="0" y="0" width="800" height="540" fill="#f1eee6"/>

  <text class="mono" x="48" y="52" font-size="11" letter-spacing="2" fill="#5f5b50">FIG. 12 — MAC · SPEED</text>
  <text class="serif" x="48" y="88" font-size="30" fill="#131210">Cut what starts with the Mac</text>
  <text class="mono" x="752" y="52" font-size="11" letter-spacing="1.5" fill="#5f5b50" text-anchor="end">5 MIN · EASY</text>

  <!-- mac window -->
  <rect x="70" y="120" width="660" height="330" fill="#e9e5d8" stroke="#131210" stroke-width="2"/>
  <line x1="70" y1="154" x2="730" y2="154" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <rect x="90" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <rect x="104" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <rect x="118" y="133" width="8" height="8" fill="none" stroke="rgba(19,18,16,.5)" stroke-width="1.5"/>
  <text class="mono" x="400" y="142" font-size="11" fill="#5f5b50" text-anchor="middle">System Settings — General</text>

  <!-- heading -->
  <text class="serif" x="110" y="202" font-size="20" fill="#131210">Login Items</text>
  <text class="mono" x="690" y="200" font-size="10.5" fill="#5f5b50" text-anchor="end">RUNS AT EVERY STARTUP</text>

  <!-- rows -->
  <rect x="110" y="237" width="12" height="12" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="136" y="249" font-size="12.5" fill="#131210">Slack</text>
  <rect x="650" y="231" width="24" height="24" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <line x1="656" y1="243" x2="668" y2="243" stroke="#131210" stroke-width="2"/>

  <rect x="110" y="279" width="12" height="12" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="136" y="291" font-size="12.5" fill="#131210">Dropbox</text>
  <rect x="650" y="273" width="24" height="24" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <line x1="656" y1="285" x2="668" y2="285" stroke="#131210" stroke-width="2"/>

  <!-- highlighted row -->
  <text class="mono" x="90" y="324" font-size="10" font-weight="600" fill="#131210">minus = out at startup</text>
  <rect x="90" y="332" width="620" height="38" fill="#c8f03c"/>
  <rect x="110" y="345" width="12" height="12" fill="#131210"/>
  <text class="mono" x="136" y="357" font-size="12.5" font-weight="600" fill="#131210">Discord</text>
  <rect x="650" y="339" width="24" height="24" fill="#f7f5ee" stroke="#131210" stroke-width="2"/>
  <line x1="655" y1="351" x2="669" y2="351" stroke="#131210" stroke-width="2.5"/>

  <rect x="110" y="387" width="12" height="12" fill="rgba(19,18,16,.5)"/>
  <text class="mono" x="136" y="399" font-size="12.5" fill="#131210">Spotify</text>
  <rect x="650" y="381" width="24" height="24" fill="#f7f5ee" stroke="#131210" stroke-width="1.5"/>
  <line x1="656" y1="393" x2="668" y2="393" stroke="#131210" stroke-width="2"/>
  <line x1="662" y1="387" x2="662" y2="399" stroke="#131210" stroke-width="2"/>

  <!-- note -->
  <text class="serif" x="110" y="440" font-size="17" fill="#5f5b50">Keep the ones you'd genuinely want back after a reboot.</text>

  <!-- caption strip -->
  <line x1="70" y1="482" x2="730" y2="482" stroke="rgba(19,18,16,.18)" stroke-width="1"/>
  <text class="mono" x="70" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50">SYSTEM SETTINGS → GENERAL → LOGIN ITEMS</text>
  <text class="mono" x="730" y="506" font-size="10.5" letter-spacing="1" fill="#5f5b50" text-anchor="end">MACOS</text>
</svg>
